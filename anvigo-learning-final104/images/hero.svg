<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3e6"/>
      <stop offset="1" stop-color="#ffe0c2"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="24" fill="url(#sky)"/>
  <!-- temple silhouette -->
  <g opacity="0.12" fill="#e85d04">
    <path d="M60 200 L90 140 L120 200 Z"/>
    <rect x="70" y="200" width="40" height="60"/>
    <path d="M500 190 L540 110 L580 190 Z"/>
    <rect x="512" y="190" width="56" height="80"/>
    <circle cx="540" cy="104" r="6"/>
  </g>
  <!-- blackboard -->
  <rect x="180" y="70" width="280" height="170" rx="10" fill="url(#board)" stroke="#b45309" stroke-width="8"/>
  <text x="320" y="130" text-anchor="middle" font-family="Poppins, Arial" font-size="26" fill="#fff" font-weight="700">a² + b² = c²</text>
  <text x="320" y="175" text-anchor="middle" font-family="Poppins, Arial" font-size="18" fill="#a7f3d0">Learn • Practice • Succeed</text>
  <!-- teacher -->
  <g>
    <circle cx="150" cy="300" r="30" fill="#f59e0b"/>
    <circle cx="150" cy="290" r="16" fill="#7c2d12"/>
    <rect x="120" y="330" width="60" height="80" rx="18" fill="#e63946"/>
    <rect x="168" y="335" width="60" height="12" rx="6" fill="#e63946" transform="rotate(-25 168 335)"/>
  </g>
  <!-- students -->
  <g>
    <circle cx="330" cy="330" r="22" fill="#fbbf24"/>
    <rect x="305" y="352" width="50" height="60" rx="14" fill="#1d7fbf"/>
    <circle cx="420" cy="335" r="22" fill="#fbbf24"/>
    <rect x="395" y="357" width="50" height="58" rx="14" fill="#14b8a6"/>
    <circle cx="510" cy="330" r="22" fill="#fbbf24"/>
    <rect x="485" y="352" width="50" height="60" rx="14" fill="#8b5cf6"/>
  </g>
  <!-- desks -->
  <rect x="290" y="415" width="90" height="12" rx="6" fill="#b45309"/>
  <rect x="380" y="418" width="90" height="12" rx="6" fill="#b45309"/>
  <rect x="470" y="415" width="90" height="12" rx="6" fill="#b45309"/>
  <!-- books -->
  <g transform="translate(70 400)">
    <rect width="70" height="14" rx="3" fill="#e63946"/>
    <rect y="-14" x="6" width="62" height="14" rx="3" fill="#1d7fbf"/>
    <rect y="-28" x="12" width="52" height="14" rx="3" fill="#0f9d58"/>
  </g>
</svg>
